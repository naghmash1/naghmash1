<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" width="1320" height="640" role="img" aria-label="whoami --map">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 14px; }
      .ink     { fill: #0f0e0d; }
      .muted   { fill: #0f0e0d; opacity: 0.50; }
      .faint   { fill: #0f0e0d; opacity: 0.30; }
      .amber   { fill: #d97706; }
      .cyan    { fill: #0891b2; }
      .land    { fill: #0f0e0d; opacity: 0.14; }

      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(1.5); }
      }

      .arc { stroke-dasharray: 800; stroke-dashoffset: 800; animation: draw 2s ease-out 0.6s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
