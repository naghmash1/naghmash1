<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Research domains: Autonomous AI, Energy Systems, Nonlinear Control, Applied AI">
  <defs>
    <style>
      .serif { font-family: ui-serif, Georgia, "Times New Roman", serif; }
      .mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
      .ink     { fill: #f3ead8; }
      .muted   { fill: #f3ead8; opacity: 0.62; }
      .faint   { fill: #f3ead8; opacity: 0.32; }
      .card    { fill: #14110d; stroke: #f3ead8; stroke-opacity: 0.10; stroke-width: 1; }

      .pulse-a { animation: pulse-a 2.4s ease-in-out infinite; }
      @keyframes pulse-a { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
  </defs>

  <rect width="1200" height="540" fill="#0b0a08"/>

  <text x="60" y="36" class="mono" fill="#f87171" font-size="12" letter-spacing="5" font-weight="700">§ 02</text>
  <text x="98" y="36" class="mono muted" font-size="12" letter-spacing="5">RESEARCH DOMAINS</text>
  <line x1="60" y1="50" x2="1140" y2="50" stroke="#f3ead8" stroke-width="0.6" opacity="0.18"/>

  <g transform="translate(60, 78)">
    <rect x="0" y="0" width="540" height="206" class="card" rx="2"/>
    <rect x="0" y="0" width="6" height="206" fill="#f87171"/>
    <text x="24" y="34" class="mono" fill="#f87171" font-size="11" letter-spacing="4" font-weight="700">01 · CRIMSON</text>
    <text x="24" y="74" class="serif ink" font-size="30" font-weight="500">Autonomous &amp; Agentic AI</text>
    <text x="24" y="108" class="mono muted" font-size="12.5" letter-spacing="0.5">multi-agent LLM negotiation and orchestration</text>
    <text x="24" y="128" class="mono muted" font-size="12.5" letter-spacing="0.5">MCP tool-use, memory, planning frameworks</text>
    <text x="24" y="148" class="mono muted" font-size="12.5" letter-spacing="0.5">LLM-driven decisions for real-time energy systems</text>
    <text x="24" y="168" class="mono muted" font-size="12.5" letter-spacing="0.5">AI resilience &amp; self-healing autonomous recovery</text>

    <g transform="translate(420, 105)">
      <line x1="0"   y1="0"   x2="50"  y2="-30" stroke="#f87171" stroke-width="1.4" opacity="0.45"/>
      <line x1="50"  y1="-30" x2="100" y2="0"   stroke="#f87171" stroke-width="1.4" opacity="0.45"/>
      <line x1="0"   y1="0"   x2="100" y2="0"   stroke="#f87171" stroke-width="1.4" opacity="0.45"/>
      <line x1="50"  y1="-30" x2="50"  y2="40"  stroke="#f87171" stroke-width="1.4" opacity="0.45"/>
      <line x1="0"   y1="0"   x2="50"  y2="40"  stroke="#f87171" stroke-width="1.4" opacity="0.45"/>
      <line x1="100" y1="0"   x2="50"  y2="40"  stroke="#f87171" stroke-width="1.4" opacity="0.45"/>
      <circle cx="0"   cy="0"   r="9" fill="#f87171"/>
      <circle cx="100" cy="0"   r="9" fill="#f87171" class="pulse-a"/>
      <circle cx="50"  cy="-30" r="9" fill="#f87171"/>
      <circle cx="50"  cy="40"  r="9" fill="#f87171"/>
    </g>
    <text x="516" y="194" class="mono faint" font-size="9" letter-spacing="2" text-anchor="end">MULTI-AGENT GRAPH</text>
  </g>

  <g transform="translate(620, 78)">
    <rect x="0" y="0" width="520" height="206" class="card" rx="2"/>
    <rect x="0" y="0" width="6" height="206" fill="#fb923c"/>
    <text x="24" y="34" class="mono" fill="#fb923c" font-size="11" letter-spacing="4" font-weight="700">02 · AMBER</text>
    <text x="24" y="74" class="serif ink" font-size="30" font-weight="500">Energy &amp; Smart Infrastructure</text>
    <text x="24" y="108" class="mono muted" font-size="12.5" letter-spacing="0.5">offshore AI datacenter microgrids on marine renewables</text>
    <text x="24" y="128" class="mono muted" font-size="12.5" letter-spacing="0.5">DC / AC microgrid &amp; nanogrid energy management</text>
    <text x="24" y="148" class="mono muted" font-size="12.5" letter-spacing="0.5">IoT utility monitoring at scale (LoRaWAN, edge compute)</text>
    <text x="24" y="168" class="mono muted" font-size="12.5" letter-spacing="0.5">MILP + LP hierarchical optimization for real-time dispatch</text>

    <g transform="translate(380, 80)">
      <g opacity="0.35">
        <line x1="0"  y1="0" x2="0"  y2="80" stroke="#fb923c" stroke-width="1"/>
        <line x1="20" y1="0" x2="20" y2="80" stroke="#fb923c" stroke-width="1"/>
        <line x1="40" y1="0" x2="40" y2="80" stroke="#fb923c" stroke-width="1"/>
        <line x1="60" y1="0" x2="60" y2="80" stroke="#fb923c" stroke-width="1"/>
        <line x1="80" y1="0" x2="80" y2="80" stroke="#fb923c" stroke-width="1"/>
        <line x1="100" y1="0" x2="100" y2="80" stroke="#fb923c" stroke-width="1"/>
        <line x1="0" y1="0"  x2="100" y2="0"  stroke="#fb923c" stroke-width="1"/>
        <line x1="0" y1="20" x2="100" y2="20" stroke="#fb923c" stroke-width="1"/>
        <line x1="0" y1="40" x2="100" y2="40" stroke="#fb923c" stroke-width="1"/>
        <line x1="0" y1="60" x2="100" y2="60" stroke="#fb923c" stroke-width="1"/>
        <line x1="0" y1="80" x2="100" y2="80" stroke="#fb923c" stroke-width="1"/>
      </g>
      <path d="M 58 4 L 42 42 L 56 42 L 44 76 L 76 32 L 58 32 Z" fill="#fb923c" class="pulse-a"/>
    </g>
    <text x="496" y="194" class="mono faint" font-size="9" letter-spacing="2" text-anchor="end">OFFSHORE MICROGRID</text>
  </g>

  <g transform="translate(60, 304)">
    <rect x="0" y="0" width="540" height="206" class="card" rx="2"/>
    <rect x="0" y="0" width="6" height="206" fill="#22d3ee"/>
    <text x="24" y="34" class="mono" fill="#22d3ee" font-size="11" letter-spacing="4" font-weight="700">03 · CYAN</text>
    <text x="24" y="74" class="serif ink" font-size="30" font-weight="500">Nonlinear Control Theory</text>
    <text x="24" y="108" class="mono muted" font-size="12.5" letter-spacing="0.5">sliding mode (SMC · FTSMC · NSFTSMC) controllers</text>
    <text x="24" y="128" class="mono muted" font-size="12.5" letter-spacing="0.5">finite-time and fixed-time convergence design</text>
    <text x="24" y="148" class="mono muted" font-size="12.5" letter-spacing="0.5">Lyapunov stability for nonlinear dynamical systems</text>
    <text x="24" y="168" class="mono muted" font-size="12.5" letter-spacing="0.5">MPC, backstepping, passivity-based, adaptive robust</text>

    <g transform="translate(370, 130)">
      <line x1="0" y1="0" x2="150" y2="0" stroke="#22d3ee" stroke-width="0.4" opacity="0.4" stroke-dasharray="2 3"/>
      <path d="M 0 0 C 8 -38, 16 -38, 24 0
               S 40 32, 48 0
               S 64 -22, 72 0
               S 88 18, 96 0
               S 112 -10, 120 0
               S 136 6, 144 0
               L 150 0"
            fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="150" cy="0" r="4" fill="#22d3ee" class="pulse-a"/>
    </g>
    <text x="516" y="194" class="mono faint" font-size="9" letter-spacing="2" text-anchor="end">SLIDING-MODE DECAY</text>
  </g>

  <g transform="translate(620, 304)">
    <rect x="0" y="0" width="520" height="206" class="card" rx="2"/>
    <rect x="0" y="0" width="6" height="206" fill="#34d399"/>
    <text x="24" y="34" class="mono" fill="#34d399" font-size="11" letter-spacing="4" font-weight="700">04 · JADE</text>
    <text x="24" y="74" class="serif ink" font-size="30" font-weight="500">Explainable &amp; Applied AI</text>
    <text x="24" y="108" class="mono muted" font-size="12.5" letter-spacing="0.5">XAI for power-system fault detection &amp; maintenance</text>
    <text x="24" y="128" class="mono muted" font-size="12.5" letter-spacing="0.5">computer-vision pipelines for industrial safety</text>
    <text x="24" y="148" class="mono muted" font-size="12.5" letter-spacing="0.5">GPU-accelerated inference for real-time applications</text>
    <text x="24" y="168" class="mono muted" font-size="12.5" letter-spacing="0.5">AI readiness frameworks for enterprise &amp; government</text>

    <g transform="translate(380, 80)">
      <line x1="0" y1="92" x2="120" y2="92" stroke="#34d399" stroke-width="0.6" opacity="0.4"/>
      <rect x="0"  y="60" width="16" height="32" fill="#34d399" opacity="0.45"/>
      <rect x="22" y="40" width="16" height="52" fill="#34d399" opacity="0.65"/>
      <rect x="44" y="20" width="16" height="72" fill="#34d399" opacity="0.85"/>
      <rect x="66" y="48" width="16" height="44" fill="#34d399" opacity="0.55"/>
      <rect x="88" y="14" width="16" height="78" fill="#34d399" class="pulse-a"/>
    </g>
    <text x="496" y="194" class="mono faint" font-size="9" letter-spacing="2" text-anchor="end">DETECTION CONFIDENCE</text>
  </g>
</svg>
