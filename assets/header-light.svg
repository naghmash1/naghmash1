  <text x="1140" y="416" class="mono ink"   font-size="12" letter-spacing="3" text-anchor="end" font-weight="600">BUILDING AI THAT ENDURES</text>
  <text x="1140" y="432" class="mono amber" font-size="11" letter-spacing="2" text-anchor="end">→ control · agents · energy</text>

  <line x1="60" y1="456"  x2="1140" y2="456"  stroke="#0f0e0d" stroke-width="0.6" opacity="0.25"/>
  <text x="60"   y="472" class="mono faint" font-size="11" letter-spacing="3">git push origin main</text>
  <text x="1140" y="472" class="mono faint" font-size="11" letter-spacing="3" text-anchor="end">github.com/naghmash1</text>
</svg>
