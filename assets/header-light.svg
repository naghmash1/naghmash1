  <text x="60" y="338" class="mono muted" font-size="14" letter-spacing="2.5">Tsinghua SIGS  ·  CyberGen Inc.  ·  Qubit Dynamics  ·  Indian River State College</text>

  <g transform="translate(740, 90)">
