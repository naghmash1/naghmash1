    <text x="12" y="-8" class="mono muted" font-size="10" letter-spacing="2.5">FIG. 1 ·  SLIDING-MODE CONVERGENCE  ·  s → 0</text>

    <line x1="0" y1="85" x2="400" y2="85" stroke="#0f0e0d" stroke-width="0.4" opacity="0.35" stroke-dasharray="3 5"/>

    <text x="6"   y="20" class="mono faint" font-size="9">+A</text>
    <text x="6"   y="155" class="mono faint" font-size="9">−A</text>
    <text x="386" y="167" class="mono faint" font-size="9" text-anchor="end">t →</text>

    <path class="wave"
          d="M 0 85
             C 16 18, 32 18, 48 85
             S 80 152, 96 85
             S 128 25, 144 85
             S 176 145, 192 85
             S 224 45, 240 85
             S 272 125, 288 85
             S 320 65, 336 85
             S 368 105, 384 85
             L 400 85"
          fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>

    <circle cx="400" cy="85" r="5" fill="#dc2626" class="pulse-dot"/>
    <circle cx="400" cy="85" r="11" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.35"/>

    <text x="0"   y="195" class="mono ink"  font-size="11" letter-spacing="1">u(t) = −k · sign(s(x,t))</text>
    <text x="400" y="195" class="mono jade" font-size="11" letter-spacing="1" text-anchor="end" font-weight="600">finite-time stability ✓</text>
  </g>

  <g transform="translate(60, 396)">
    <g>
      <rect x="0" y="0" width="190" height="30" rx="15" fill="#d97706"/>
      <text x="95" y="20" class="mono paper" font-size="12" letter-spacing="2.5" text-anchor="middle" font-weight="700">30+ SCI PAPERS</text>
    </g>
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#dc2626"/>
      <text x="75" y="20" class="mono paper" font-size="12" letter-spacing="2.5" text-anchor="middle" font-weight="700">H-INDEX 17</text>
    </g>
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="195" height="30" rx="15" fill="#059669"/>
      <text x="97.5" y="20" class="mono paper" font-size="12" letter-spacing="2.5" text-anchor="middle" font-weight="700">1,000+ CITATIONS</text>
    </g>
    <g transform="translate(565, 0)">
      <rect x="0" y="0" width="125" height="30" rx="15" fill="#0891b2"/>
      <text x="62.5" y="20" class="mono paper" font-size="12" letter-spacing="2.5" text-anchor="middle" font-weight="700">3 STARTUPS</text>
