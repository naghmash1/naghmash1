<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Dr. Naghmash Ali — Research Scientist, Educator, Entrepreneur">
  <defs>
    <radialGradient id="burst-l" cx="80%" cy="20%" r="55%">
      <stop offset="0%"  stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#dc2626" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burst-l-2" cx="10%" cy="95%" r="50%">
      <stop offset="0%"  stop-color="#059669" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="dots-l" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#0f0e0d" opacity="0.10"/>
    </pattern>
    <style>
      .serif { font-family: ui-serif, Georgia, "Times New Roman", serif; }
      .mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
      .ink     { fill: #0f0e0d; }
      .paper   { fill: #fef9ed; }
      .amber   { fill: #d97706; }
      .crimson { fill: #dc2626; }
      .jade    { fill: #059669; }
      .cyan    { fill: #0891b2; }
      .gold    { fill: #ca8a04; }
      .muted   { fill: #0f0e0d; opacity: 0.55; }
      .faint   { fill: #0f0e0d; opacity: 0.32; }

      .wave { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3s ease-out 0.2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .pulse-dot { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.45; transform: scale(0.7); }
      }

      .fade-in { opacity: 0; animation: fadein 1.6s ease-out 0.8s forwards; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="480" fill="#fef9ed"/>
  <rect width="1200" height="480" fill="url(#dots-l)"/>
  <rect width="1200" height="480" fill="url(#burst-l)"/>
  <rect width="1200" height="480" fill="url(#burst-l-2)"/>

  <line x1="60" y1="58"  x2="1140" y2="58"  stroke="#0f0e0d" stroke-width="0.6" opacity="0.25"/>
  <text x="60"   y="46" class="mono muted"   font-size="12" letter-spacing="3.5">DOSSIER · 2026 · VOL. 1</text>
  <text x="600"  y="46" class="mono crimson" font-size="12" letter-spacing="3.5" text-anchor="middle">FIELD STATION</text>
  <text x="1140" y="46" class="mono muted"   font-size="12" letter-spacing="3.5" text-anchor="end">22.5431° N · SHENZHEN</text>

  <text x="60" y="108" class="mono crimson" font-size="14" letter-spacing="6" font-weight="700">CLASSIFIED · OPEN SOURCE</text>

  <text x="60" y="244" class="serif ink" font-size="118" font-weight="500" letter-spacing="-2">Naghmash Ali</text>
